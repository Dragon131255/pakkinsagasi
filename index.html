<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>パッキン探し</title>
<link rel="icon" href="pakkinsagasi.ico">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1565C0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="パッキン探し">
<style>
  :root {
    --inner: #1E88E5; --outer: #43A047; --width: #FB8C00; --depth: #8E24AA;
    --ring: #E53935; --main: #1565C0; --br: #37474F;
    --bg: #F3F6FB; --card: #fff; --text: #263238; --sub: #607D8B; --line: #CFD8DC;
    --top: #C8E6C9; --alt: #E3F2FD; --err: #C62828;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Yu Gothic UI", "Hiragino Sans", "Noto Sans JP", sans-serif; font-size: 16px; }
  header { background: var(--main); color: #fff; padding: 12px 16px; font-weight: bold; font-size: 18px; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border-radius: 10px; padding: 16px; margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .row[hidden] { display: none; }
  /* ダストシール：選んだ結果の D・溝幅を図の上で色付けする */
  .figWrap { position: relative; margin-bottom: 12px; }
  #pkFig .figWrap img { margin-bottom: 0; }
  .pkMarks { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  .pkMarks rect { fill-opacity: .18; stroke-width: 4; }
  .cd, .ring dt.cd { color: var(--inner); font-weight: bold; }
  #pkMarkVals { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: -4px 0 12px; font-size: 15px; font-weight: bold; }
  #pkMarkVals[hidden] { display: none; }
  .cD, .ring dt.cD { color: var(--outer); font-weight: bold; } .cW, .ring dt.cW { color: var(--width); font-weight: bold; } .cC, .ring dt.cC { color: var(--depth); font-weight: bold; }
  .row label { flex: 1 1 50%; font-weight: bold; }
  .row input, .row select { flex: 1 1 50%; min-width: 0; font-size: 16px; padding: 10px; border: 1px solid var(--line);
    border-radius: 6px; background: #fff; color: var(--text); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  button { background: var(--main); color: #fff; border: 0; border-radius: 6px; padding: 12px 32px; font-size: 16px; font-weight: bold; }
  .hint { color: var(--sub); font-size: 13px; }
  svg { width: 100%; height: auto; display: block; }
  #msg { white-space: pre-wrap; font-size: 14px; line-height: 1.6; }
  #msg.error { color: var(--err); font-weight: bold; }
  h2 { font-size: 16px; margin: 16px 0 8px; }
  .ring { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; background: #fff; }
  .ring.top { background: var(--top); border-color: #A5D6A7; }
  .ring.alt { background: var(--alt); }
  .ring .name { font-weight: bold; font-size: 17px; }
  .ring .name small { font-weight: normal; color: var(--sub); font-size: 13px; margin-left: 8px; }
  .ring dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 6px 0 0; font-size: 14px; }
  .ring dt { color: var(--sub); }
  .ring dd { margin: 0; }
  .ring dd b { font-size: 15px; }
  .ring .tol { display: inline-block; margin-left: 8px; padding: 0 6px; border-radius: 4px; background: #FFF3E0; color: #E65100; font-size: 13px; font-weight: bold; }
  #pkFig img { width: 100%; height: auto; display: block; margin-bottom: 12px; }
  .ring.pk { cursor: pointer; }
  /* メーカーごとの色（カードの左端の帯・見出しとメーカー欄の札） */
  .mk-sakagami { --mk: #1565C0; } .mk-valqua { --mk: #00897B; } .mk-nok { --mk: #D32F2F; }
  .ring.pk[class*="mk-"] { border-left: 6px solid var(--mk); }
  .mkTag { display: inline-block; padding: 0 8px; border-radius: 10px; background: var(--mk); color: #fff; font-size: 12px; font-weight: bold; vertical-align: middle; }
  h2 .mkTag { margin-left: 8px; }
  .ring.sel { outline: 3px solid var(--main); }
  .figttl { font-weight: bold; font-size: 14px; margin-bottom: 6px; }
</style>
</head>
<body>
<header>◎ パッキン探し ─ Oリング・油圧パッキン選定</header>
<main>
  <form class="card" id="form" novalidate>
    <div class="row"><label for="kind">種類</label>
      <select id="kind"><option value="oring">Oリング（JIS B 2401）</option><option value="packing">Uパッキン（油圧）</option><option value="dust">ダストシール</option></select></div>
    <div class="row"><label for="inner"><span class="dot" style="background:var(--inner)"></span><span id="innerLabel">d 溝の内径</span> [mm]</label>
      <input id="inner" inputmode="decimal" autocomplete="off"></div>
    <div class="row" id="outerRow"><label for="outer"><span class="dot" style="background:var(--outer)"></span>D 溝の外径 [mm]</label>
      <input id="outer" inputmode="decimal" autocomplete="off"></div>
    <div class="row" id="widthRow"><label for="width"><span class="dot" style="background:var(--width)"></span>G 溝幅 [mm]</label>
      <input id="width" inputmode="decimal" autocomplete="off"></div>
    <div class="row"><label for="use">用途</label>
      <select id="use"><option value="Dynamic">運動用</option><option value="Static" selected>固定用</option></select></div>
    <div class="row"><label for="br"><span class="dot" style="background:var(--br)"></span>バックアップリング</label>
      <select id="br"><option value="None">なし</option><option value="One">片側</option><option value="Both">両側</option></select></div>
    <div class="actions"><button type="submit">検索</button><span class="hint">空欄の寸法は判定に使いません</span></div>
  </form>

  <div class="card" id="figCard">
    <svg viewBox="0 0 400 215" role="img" aria-label="溝の断面図">
      <defs>
        <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
          <rect width="6" height="6" fill="#ECEFF1"/><line x1="0" y1="0" x2="0" y2="6" stroke="#90A4AE" stroke-width="1.5"/>
        </pattern>
        <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFD8DC"/><stop offset="1" stop-color="#90A4AE"/></linearGradient>
        <linearGradient id="ringg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8A80"/><stop offset="1" stop-color="#B71C1C"/></linearGradient>
        <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
      </defs>
      <g font-size="10" font-weight="bold">
        <text x="6" y="14" fill="#263238">溝の断面図（軸に溝を切る場合）</text>
        <rect x="0" y="20" width="400" height="28" fill="url(#hatch)"/>
        <line x1="0" y1="48" x2="400" y2="48" stroke="#708090"/>
        <text x="6" y="36" fill="#455A64">相手側（穴）</text>
        <path d="M0,70 H170 V128 H280 V70 H400 V205 H0 Z" fill="url(#shaft)" stroke="#708090"/>
        <text x="6" y="84" fill="#37474F">軸</text>
        <g id="brs" fill="#546E7A" stroke="#000"></g>
        <text id="brlabel" x="283" y="96" fill="#37474F" display="none">BR</text>
        <ellipse id="oring" cx="225" cy="88" rx="45" ry="40" fill="url(#ringg)" stroke="#7F0000" stroke-width="1.2"/>
        <text id="figRing" x="108" y="62" fill="#E53935">Oリング</text>
        <line x1="0" y1="203" x2="400" y2="203" stroke="#607D8B" stroke-dasharray="8 3 2 3"/>
        <text x="345" y="198" fill="#607D8B" font-weight="normal">中心線</text>
        <g stroke-dasharray="4 3" stroke="#B0BEC5">
          <line x1="140" y1="128" x2="170" y2="128"/><line x1="170" y1="128" x2="170" y2="154"/>
          <line x1="280" y1="128" x2="280" y2="154"/><line x1="280" y1="128" x2="330" y2="128"/>
        </g>
        <g stroke-width="1.6" marker-start="url(#arw)" marker-end="url(#arw)">
          <line x1="30" y1="203" x2="30" y2="48" stroke="#43A047"/>
          <line x1="150" y1="203" x2="150" y2="128" stroke="#1E88E5"/>
          <line x1="170" y1="148" x2="280" y2="148" stroke="#FB8C00"/>
          <line x1="320" y1="48" x2="320" y2="128" stroke="#8E24AA"/>
        </g>
        <text id="figD" x="36" y="110" fill="#43A047">D 溝の外径</text>
        <text id="figd" x="156" y="190" fill="#1E88E5">d 溝の内径</text>
        <text id="figG" x="190" y="170" fill="#FB8C00">G 溝幅</text>
        <text x="326" y="116" fill="#8E24AA">H 溝深さ</text>
        <text x="288" y="141" fill="#8E24AA" font-weight="normal">H = (D − d) / 2</text>
      </g>
    </svg>
    <div id="pkFig" hidden>
      <div id="pkPiston">
      <div class="figttl"><span class="figP">SKY</span> 寸法指示図（ピストン用）</div>
      <div class="figWrap"><img id="pkImgPiston" src="images/sky-piston.png" alt="寸法指示図（ピストン用）"><svg id="pkMarksPiston" class="pkMarks" preserveAspectRatio="none" aria-hidden="true"></svg></div>
      </div>
      <div id="pkRod">
      <div class="figttl"><span class="figP">SKY</span> 寸法指示図（ロッド用）</div>
      <div class="figWrap"><img id="pkImgRod" src="images/sky-rod.png" alt="寸法指示図（ロッド用）"><svg id="pkMarksRod" class="pkMarks" preserveAspectRatio="none" aria-hidden="true"></svg></div>
      </div>
      <div id="pkMarkVals" hidden></div>
      <div class="hint">出典：<span id="pkSrc">阪上製作所 <span class="figP">SKY</span>パッキン 製品ページ</span>。検索結果をタップすると、その製品の図に切り替わります。</div>
    </div>
  </div>

  <div class="card">
    <div id="msg">寸法を入力して［検索］を押してください。</div>
    <div id="results"></div>
  </div>
</main>
<script src="search.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var table = null, ptable = null;

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

  fetch('data/oring_jis_b2401.csv')
    .then(function (r) { if (!r.ok) throw new Error(); return r.text(); })
    .then(function (t) { table = Pakkin.parseTable(t); })
    .catch(function () { showError('規格表（data/oring_jis_b2401.csv）を読み込めませんでした。'); });
  fetch('data/sakagami_hydraulic.csv')
    .then(function (r) { if (!r.ok) throw new Error(); return r.text(); })
    .then(function (t) { ptable = Pakkin.parsePackingTable(t); })
    .catch(function () { showError('サイズ表（data/sakagami_hydraulic.csv）を読み込めませんでした。'); });
  var dtable = null;
  fetch('data/dust_seal.csv')
    .then(function (r) { if (!r.ok) throw new Error(); return r.text(); })
    .then(function (t) { dtable = Pakkin.parsePackingTable(t); })
    .catch(function () { showError('サイズ表（data/dust_seal.csv）を読み込めませんでした。'); });

  // 阪上パッキンの図：寸法指示図がある製品だけ切り替える
  // 製品ごとにある図（ピストン用・ロッド用）。UHP・MLP・MLR はバルカー、UPH は NOK のカタログの図
  var FIG_PRODUCTS = { SKY: ['piston', 'rod'], KY: ['piston', 'rod'], UHP: ['piston'], MLP: ['piston'], MLR: ['rod'], UPH: ['piston', 'rod'], SDR: ['rod'], LBH: ['rod'], DHS: ['rod'], DKI: ['rod'] };
  var VALQUA = ['UHP', 'MLP', 'MLR', 'DHS'], NOK = ['UPH', 'DKI', 'LBH'];
  function maker(p) { return VALQUA.indexOf(p) >= 0 ? 'バルカー' : NOK.indexOf(p) >= 0 ? 'NOK' : '阪上製作所'; }
  function mkClass(p) { return VALQUA.indexOf(p) >= 0 ? 'mk-valqua' : NOK.indexOf(p) >= 0 ? 'mk-nok' : 'mk-sakagami'; }
  function mkTag(p) { return '<span class="mkTag ' + mkClass(p) + '">' + maker(p) + '</span>'; }
  // 公差を数値の後ろに色付きで出す（両用は「ピストン …／ロッド …」を別々の枠にする）
  function tolHtml(s) {
    if (!s || s === '—') return '';
    return s.split('／').map(function (p) { return '<span class="tol">' + esc(p) + '</span>'; }).join('');
  }
  function setPackingFig(p) {
    var uses = FIG_PRODUCTS[p];
    if (!uses) return;
    var k = p.toLowerCase();
    $('pkPiston').hidden = uses.indexOf('piston') < 0;
    $('pkRod').hidden = uses.indexOf('rod') < 0;
    if (!$('pkPiston').hidden) $('pkImgPiston').src = 'images/' + k + '-piston.png';
    if (!$('pkRod').hidden) $('pkImgRod').src = 'images/' + k + '-rod.png';
    $('pkSrc').innerHTML = VALQUA.indexOf(p) >= 0
      ? 'バルカー 油圧用パッキン カタログ <span class="figP"></span>シリーズ'
      : NOK.indexOf(p) >= 0 ? 'NOK <span class="figP"></span>型 寸法表'
      : p === 'SDR' ? '阪上製作所 <span class="figP"></span> 製品ページ'
      : '阪上製作所 <span class="figP"></span>パッキン 製品ページ';
    [].forEach.call(document.querySelectorAll('.figP'), function (el) { el.textContent = p; });
  }
  // 寸法指示図で各寸法の記号がある場所（画像のピクセル座標 [x, y, 幅, 高さ]）。キーは画像名
  // ダストシール：D・W（溝幅）・C ／ Uパッキン：d・D1・GA・GB（UPH の図では HA・HB）
  var FIG_MARKS = {
    'sdr-rod': { w: 1200, h: 569, D: [128, 240, 48, 110], W: [214, 66, 88, 32], C: [324, 238, 34, 110] },
    'dhs-rod': { w: 1200, h: 367, D: [264, 170, 40, 130], W: [408, 48, 32, 26], C: [494, 168, 32, 95] },
    'lbh-rod': { w: 1200, h: 752, D: [552, 385, 36, 88], W: [772, 22, 92, 32], C: [904, 378, 34, 108] },
    'dki-rod': { w: 1200, h: 801, D: [562, 360, 38, 105], W: [812, 14, 42, 32] },
    'sky-piston': { w: 1200, h: 428, d: [452, 190, 36, 80], D1: [302, 178, 32, 115], GA: [380, 170, 70, 28], GB: [570, 170, 70, 28] },
    'sky-rod': { w: 1200, h: 478, d: [272, 205, 32, 75], GA: [172, 48, 80, 30], GB: [176, 396, 80, 30] },
    'ky-piston': { w: 848, h: 303, d: [302, 135, 26, 70], D1: [192, 120, 26, 95], GA: [242, 118, 58, 22], GB: [377, 118, 58, 22] },
    'ky-rod': { w: 1200, h: 487, d: [322, 210, 32, 80], GA: [172, 62, 82, 30], GB: [172, 393, 82, 30] },
    'uhp-piston': { w: 1200, h: 387, d: [420, 188, 30, 70], D1: [274, 175, 30, 85], GA: [350, 178, 34, 26], GB: [508, 178, 40, 26] },
    'mlp-piston': { w: 1200, h: 391, d: [418, 182, 32, 70], D1: [270, 172, 30, 90], GA: [344, 180, 38, 28], GB: [500, 178, 46, 28] },
    'mlr-rod': { w: 1200, h: 370, d: [418, 118, 32, 72], GA: [356, 8, 44, 28], GB: [355, 294, 46, 30] },
    'uph-piston': { w: 1200, h: 605, d: [442, 268, 30, 68], D1: [768, 243, 32, 90], GA: [434, 502, 66, 26], GB: [632, 502, 74, 26] },
    'uph-rod': { w: 1200, h: 634, d: [378, 298, 32, 100], GA: [606, 592, 78, 28], GB: [598, 48, 84, 28] }
  };
  var MARK_COLOR = { d: 'var(--inner)', D: 'var(--outer)', D1: 'var(--depth)', C: 'var(--depth)', W: 'var(--width)', GA: 'var(--width)', GB: 'var(--width)' };
  var MARK_CLASS = { d: 'cd', D: 'cD', D1: 'cC', C: 'cC', W: 'cW', GA: 'cW', GB: 'cW' };
  // 値に公差を（ ）で付ける（カードの data-vals と図の下の数値用）
  function withTol(v, t) { return v + (t && t !== '—' ? '（' + t + '）' : ''); }
  // 入口側の穴径（データの D1Dia）の、図での記号。DKI の図にはない
  var C_LABEL = { SDR: 'C', DHS: 'C', LBH: 'S' };
  // 溝幅の、図での記号
  var W_LABEL = { SDR: 'G', DHS: 'G', LBH: 'H', DKI: 'H' };
  // 選んだカードの寸法を、図（ピストン用・ロッド用）の記号の場所に色付きの枠で示し、図の下に数値を出す（card が null なら消す）
  // カードの data-vals：[{ k: 図のキー, l: 表示名, v: 値（公差付き） }, ...]
  function markFig(card) {
    var vals = card ? JSON.parse(card.getAttribute('data-vals') || '[]') : [];
    var p = card ? card.getAttribute('data-product').toLowerCase() : '';
    [['pkMarksPiston', '-piston', 'pkPiston'], ['pkMarksRod', '-rod', 'pkRod']].forEach(function (a) {
      var svg = $(a[0]), m = FIG_MARKS[p + a[1]];
      svg.innerHTML = '';
      if (!m || $(a[2]).hidden) return;
      svg.setAttribute('viewBox', '0 0 ' + m.w + ' ' + m.h);
      vals.forEach(function (x) {
        var b = m[x.k];
        if (!b) return;
        var r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        r.setAttribute('x', b[0]); r.setAttribute('y', b[1]); r.setAttribute('width', b[2]); r.setAttribute('height', b[3]);
        r.setAttribute('rx', 6); r.style.fill = MARK_COLOR[x.k]; r.style.stroke = MARK_COLOR[x.k];
        svg.appendChild(r);
      });
    });
    $('pkMarkVals').hidden = !vals.length;
    $('pkMarkVals').innerHTML = vals.map(function (x) {
      return '<span class="' + MARK_CLASS[x.k] + '">■ ' + esc(x.l) + ' = ' + esc(x.v) + '</span>';
    }).join('');
  }
  $('results').addEventListener('click', function (e) {
    var card = e.target.closest('.ring.pk');
    if (!card) return;
    [].forEach.call(document.querySelectorAll('.ring.sel'), function (el) { el.classList.remove('sel'); });
    card.classList.add('sel');
    setPackingFig(card.getAttribute('data-product'));
    markFig(card);
    $('figCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  // 阪上パッキンは運動用なので「用途」は使わない
  $('kind').addEventListener('change', function () {
    var pk = $('kind').value === 'packing', dust = $('kind').value === 'dust';
    $('use').disabled = pk || dust;
    $('br').disabled = dust;   // ダストシールはバックアップリングを使わない
    $('figRing').textContent = pk ? 'パッキン' : 'Oリング';
    $('innerLabel').textContent = dust ? 'd ロッド径' : 'd 溝の内径';
    $('outerRow').hidden = dust; $('widthRow').hidden = dust;   // ダストシールはロッド径だけで検索
    document.querySelector('#figCard svg').style.display = pk || dust ? 'none' : '';
    if (pk) setPackingFig('SKY'); else if (dust) setPackingFig('SDR');
    markFig(null);
    $('pkFig').hidden = !(pk || dust);
    $('msg').className = ''; $('msg').textContent = '寸法を入力して［検索］を押してください。'; $('results').innerHTML = '';
  });

  // 図の数値を入力に合わせて更新
  function updateFig() {
    [['figD', 'D 溝の外径', 'outer'], ['figd', 'd 溝の内径', 'inner'], ['figG', 'G 溝幅', 'width']].forEach(function (a) {
      var v = $(a[2]).value.trim();
      $(a[0]).textContent = a[1] + (v ? ' = ' + v : '');
    });
    var sides = { None: [], One: ['R'], Both: ['L', 'R'] }[$('br').value];
    var g = $('brs'); g.innerHTML = '';
    var x1 = 180, x2 = 270, w = 16;
    sides.forEach(function (s) {
      var bx = s === 'L' ? 170 : 280 - w;
      var r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      r.setAttribute('x', bx); r.setAttribute('y', 48); r.setAttribute('width', w); r.setAttribute('height', 80);
      g.appendChild(r);
      if (s === 'L') x1 = 170 + w + 2; else x2 = 280 - w - 2;
    });
    $('brlabel').setAttribute('display', sides.length ? 'inline' : 'none');
    var o = $('oring');
    o.setAttribute('cx', (x1 + x2) / 2); o.setAttribute('rx', (x2 - x1) / 2);
  }
  ['inner', 'outer', 'width'].forEach(function (id) { $(id).addEventListener('input', updateFig); });
  $('br').addEventListener('change', updateFig);
  updateFig();

  function readNumber(id, label) {
    var s = $(id).value.trim().replace(/[０-９．]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
    if (s === '') return null;
    if (!/^[+-]?(\d+\.?\d*|\.\d+)$/.test(s)) throw new Error(label + ' に数値を入力してください。');
    return parseFloat(s);
  }

  function showError(text) { var m = $('msg'); m.className = 'error'; m.textContent = text; $('results').innerHTML = ''; }
  // '{0:0.0#}' と同じ：小数1〜2桁
  function fmt(v) { return v == null ? '—' : v.toFixed(2).replace(/0$/, ''); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    document.activeElement && document.activeElement.blur();
    try {
      if (!table) throw new Error('規格表を読み込み中です。少し待ってからもう一度押してください。');
      var inner = readNumber('inner', $('kind').value === 'dust' ? 'ロッド径' : '溝の内径');
      var isDust = $('kind').value === 'dust';
      var outer = isDust ? null : readNumber('outer', '溝の外径');
      var width = isDust ? null : readNumber('width', '溝幅');

      if ($('kind').value === 'dust') {
        if (!dtable) throw new Error('サイズ表を読み込み中です。少し待ってからもう一度押してください。');
        var dr = Pakkin.findPacking({ inner: inner, outer: outer, width: width, backupRing: 'None', table: dtable, products: Pakkin.DustProducts, label: 'ダストシール' });
        var dl = ['判定条件：' + dr.Notes.join(' / ')];
        if (dr.Candidates.length === 0) dl = dl.concat(dr.Reasons);
        else {
          dl.push(dr.Candidates.length + ' 件見つかりました（製品ごとに最大 ' + Pakkin.MaxResults + ' 件、寸法の差が小さい順）。');
          dl.push('出典：SDR は阪上製作所の製品ページ、DHS はバルカーの油圧用パッキン カタログ、LBH・DKI は NOK の寸法表。使用条件は各社のカタログで確認してください。');
        }
        $('msg').className = ''; $('msg').textContent = dl.join('\n');
        var dh = '', dprev = null, di = 0;
        dr.Candidates.forEach(function (r) {
          if (r.Product !== dprev) {
            var n = dr.Candidates.filter(function (x) { return x.Product === r.Product; }).length;
            dh += '<h2>' + esc(r.Product) + '（' + n + ' 件）' + mkTag(r.Product) + '</h2>'; dprev = r.Product; di = 0;
          }
          var dv = [{ k: 'D', l: 'D', v: withTol(r.D2, r.TolOuter) }, { k: 'W', l: W_LABEL[r.Product] || '溝幅', v: withTol(r.Width, r.TolWidth) }];
          if (r.DiaD1 && C_LABEL[r.Product]) dv.push({ k: 'C', l: C_LABEL[r.Product], v: withTol(r.DiaD1, r.TolD1) });
          dh += '<div class="ring pk ' + mkClass(r.Product) + (di === 0 ? ' top' : ' alt') + '" data-product="' + esc(r.Product) + '" data-vals="' + esc(JSON.stringify(dv)) + '">'
            + '<div class="name">' + esc(r.Code) + '<small>ロッド用</small></div><dl>'
            + '<dt class="cD">D</dt><dd><b>' + r.D2 + '</b>' + tolHtml(r.TolOuter) + '</dd>'
            + '<dt class="cW">' + (W_LABEL[r.Product] || '溝幅') + '</dt><dd><b>' + r.Width + '</b>' + tolHtml(r.TolWidth) + '</dd>'
            + (r.DiaD1 && C_LABEL[r.Product] ? '<dt class="cC">' + C_LABEL[r.Product] + '</dt><dd><b>' + esc(r.DiaD1) + '</b>' + tolHtml(r.TolD1) + '</dd>' : '')
            + ''
            + '<dt>メーカー</dt><dd>' + mkTag(r.Product) + '</dd>'
            + '</dl></div>';
          di++;
        });
        $('results').innerHTML = dh;
        if (dr.Candidates.length) setPackingFig(dr.Candidates[0].Product);
        markFig(document.querySelector('#results .ring.pk'));   // 最初は先頭の結果の寸法を図に示す
        if (dh) $('msg').scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }
      if ($('kind').value === 'packing') {
        if (!ptable) throw new Error('サイズ表を読み込み中です。少し待ってからもう一度押してください。');
        var pr = Pakkin.findPacking({ inner: inner, outer: outer, width: width, backupRing: $('br').value, table: ptable });
        var pl = ['判定条件：' + pr.Notes.join(' / ')];
        if (pr.Candidates.length === 0) pl = pl.concat(pr.Reasons);
        else {
          pl.push(pr.Candidates.length + ' 件見つかりました（製品ごとに最大 ' + Pakkin.MaxResults + ' 件、寸法の差が小さい順）。');
          pl.push('出典：GPY〜KY は阪上製作所の製品ページ、UHP・MLP・MLR はバルカーの油圧用パッキン カタログ、UPH は NOK の UPH 型 寸法表。使用条件（圧力・速度・温度）は各社のカタログで確認してください。');
        }
        $('msg').className = ''; $('msg').textContent = pl.join('\n');
        var useName = { Piston: 'ピストン用', Rod: 'ロッド用', Both: 'ピストン・ロッド両用' };
        var ph = '', prev = null, idx = 0;
        pr.Candidates.forEach(function (r) {
          if (r.Product !== prev) {
            var n = pr.Candidates.filter(function (x) { return x.Product === r.Product; }).length;
            ph += '<h2>' + esc(r.Product) + 'パッキン（' + n + ' 件）' + mkTag(r.Product) + '</h2>'; prev = r.Product; idx = 0;
          }
          // 溝幅の記号は図に合わせる（UPH の図は HA・HB）
          var wk = $('br').value === 'None' ? 'GA' : 'GB', wl = r.Product === 'UPH' ? wk.replace('G', 'H') : wk;
          var pv = [{ k: 'd', l: 'd', v: withTol(r.D1, r.TolInner) }];
          if (r.DiaD1) pv.push({ k: 'D1', l: 'D1', v: withTol(r.DiaD1, r.TolD1) });
          pv.push({ k: wk, l: wl, v: withTol(r.Width, r.TolWidth) });
          ph += '<div class="ring pk ' + mkClass(r.Product) + (idx === 0 ? ' top' : ' alt') + '" data-product="' + esc(r.Product) + '" data-vals="' + esc(JSON.stringify(pv)) + '">'
            + '<div class="name">' + esc(r.Code) + '<small>' + useName[r.Use] + '</small></div><dl>'
            + '<dt class="cd">溝内径 d</dt><dd><b>' + r.D1 + '</b>' + tolHtml(r.TolInner) + '</dd>'
            + '<dt class="cC">D1</dt><dd>' + (r.DiaD1 ? '<b>' + r.DiaD1 + '</b>' + tolHtml(r.TolD1) : '—') + '</dd>'
            + '<dt class="cW">' + wl + '</dt><dd><b>' + r.Width + '</b>' + tolHtml(r.TolWidth) + '</dd>'
            + (r.Backup ? '<dt>バックアップ</dt><dd>' + esc(r.Backup) + '</dd>' : '')
            + '<dt>メーカー</dt><dd>' + mkTag(r.Product) + '</dd>'
            + '</dl></div>';
          idx++;
        });
        $('results').innerHTML = ph;
        if (pr.Candidates.length) setPackingFig(pr.Candidates[0].Product);
        markFig(document.querySelector('#results .ring.pk'));   // 最初は先頭の結果の寸法を図に示す
        if (ph) $('msg').scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }
      var res = Pakkin.findORing({ inner: inner, outer: outer, width: width, use: $('use').value, backupRing: $('br').value, table: table });

      var lines = [];
      if (res.GrooveDepth != null) lines.push('溝深さ ' + res.GrooveDepth.toFixed(2) + ' mm');
      lines.push('判定条件：' + res.Notes.join(' / '));
      if (res.Candidates.length === 0) {
        lines.push('条件に合うOリングはありませんでした。');
        lines = lines.concat(res.Reasons);
      } else {
        var order = inner != null ? '内径の伸びが小さい順' : outer != null ? 'つぶし率が推奨範囲の中央に近い順' : '溝充填率が上限に近い順';
        lines.push(res.Candidates.length + ' 件見つかりました（系列ごとに最大 ' + Pakkin.MaxResults + ' 件、' + order + '）。');
      }
      var m = $('msg'); m.className = ''; m.textContent = lines.join('\n');

      var html = '';
      ['P', 'G'].forEach(function (s) {
        var list = res.Candidates.filter(function (r) { return r.Series === s; });
        if (!list.length) return;
        html += '<h2>' + s + '系列（' + list.length + ' 件）</h2>';
        list.forEach(function (r, i) {
          html += '<div class="ring' + (i === 0 ? ' top' : i % 2 ? ' alt' : '') + '">'
            + '<div class="name">' + esc(r.Name) + '<small>線径 d2 ' + r.D2.toFixed(1) + ' / 内径 d1 ' + r.D1.toFixed(1) + '</small></div><dl>'
            + '<dt class="cd">溝内径 d</dt><dd>' + fmt(r.StdInner) + '（' + esc(r.TolInner) + '）</dd>'
            + '<dt class="cD">溝外径 D</dt><dd>' + fmt(r.StdOuter) + '（' + esc(r.TolOuter) + '）</dd>'
            + '<dt class="cW">溝幅 G</dt><dd>' + fmt(r.StdWidth) + '（' + esc(r.TolWidth) + '）</dd>'
            + '</dl></div>';
        });
      });
      $('results').innerHTML = html;
      if (html) $('msg').scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (err) {
      showError(err.message);
    }
  });
})();
</script>
</body>
</html>
